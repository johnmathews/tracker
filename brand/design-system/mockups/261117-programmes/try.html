<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How a programme looks, to try</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="marks.css">
<link rel="stylesheet" href="proto.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--canvas); }
  #screen { width: 100vw; height: 100vh; height: 100dvh; }
  /* The mockup's own switch, out of the way at the bottom left: which screen, which option, which theme. */
  .mock { position: fixed; z-index: 50; left: 8px; bottom: 8px; font: 600 14px/20px var(--font-sans); color: var(--ink-secondary); }
  .mock > button { height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius-full); background: var(--canvas); color: inherit; font: inherit; cursor: pointer; }
  .mock .panel { display: none; position: absolute; left: 0; bottom: 40px; width: max-content; max-width: calc(100vw - 16px); padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-overlay); color: var(--ink); }
  .mock.open .panel { display: grid; gap: 10px; }
  .mock .panel div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .mock .panel span { width: 64px; color: var(--ink-secondary); font-weight: 400; }
  .mock .panel button { min-width: 44px; height: 36px; padding: 0 10px; border: 1px solid var(--control-border); border-radius: var(--radius-md); background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
  .mock .panel button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .mock .panel button[hidden] { display: none; }
</style>
</head>
<body>
<div id="screen"></div>
<div class="mock">
  <div class="panel" role="group" aria-label="Mockup">
    <div><span>Screen</span><button data-k="screen" data-v="programmes">6 Programmes</button><button data-k="screen" data-v="preview">7 Preview</button><button data-k="screen" data-v="overview">1 Overview</button><button data-k="screen" data-v="change">3 Change</button><button data-k="screen" data-v="activity">4 Activity</button><button data-k="screen" data-v="week">5 Week</button></div>
    <div><span>Option</span><button data-k="opt" data-v="a">A</button><button data-k="opt" data-v="b">B</button><button data-k="opt" data-v="c">C</button></div>
    <div data-only="overview"><span>Cells</span><button data-k="cells" data-v="a">2A Icons</button><button data-k="cells" data-v="b">2B Words</button><button data-k="cells" data-v="c">2C Fill</button></div>
    <div data-only="activity"><span>Activity</span><button data-k="act" data-v="squat">Back squat</button><button data-k="act" data-v="deadlift">Deadlift</button></div>
    <div><span>Theme</span><button data-k="theme" data-v="system">System</button><button data-k="theme" data-v="light">Light</button><button data-k="theme" data-v="dark">Dark</button></div>
  </div>
  <button type="button" aria-expanded="false">Mockup</button>
</div>
<script src="proto.js"></script>
<script>
  // The hash carries the choice: screen-option, then the cells, the activity and the theme
  // ("#overview-c", "#overview-a-cells-b-dark", "#activity-a-deadlift", "#programmes-b", "#preview-b").
  const SCREENS = ['overview', 'change', 'activity', 'week', 'programmes', 'preview']
  const read = () => {
    const h = location.hash.slice(1).split('-')
    const screen = SCREENS.includes(h[0]) ? h[0] : 'overview'
    const three = screen === 'overview' || screen === 'programmes'
    const max = three ? 'c' : 'b'
    let opt = ['a', 'b', 'c'].includes(h[1]) ? h[1] : (screen === 'overview' ? 'c' : 'a')
    if (opt > max) opt = 'a'
    const at = h.indexOf('cells')
    return { screen, opt, cells: at > 0 && h[at + 1] ? h[at + 1] : 'a',
      act: h.includes('deadlift') ? 'deadlift' : 'squat',
      theme: h.includes('dark') ? 'dark' : h.includes('light') ? 'light' : 'system' }
  }
  const write = (s) => {
    location.hash = [s.screen, s.opt, s.screen === 'overview' && s.cells !== 'a' ? `cells-${s.cells}` : '', s.screen === 'activity' && s.act === 'deadlift' ? 'deadlift' : '', s.theme === 'system' ? '' : s.theme].filter(Boolean).join('-')
  }
  function start() {
    const s = read()
    if (s.theme === 'system') document.documentElement.removeAttribute('data-theme')
    else document.documentElement.dataset.theme = s.theme
    const old = document.getElementById('screen')
    const el = document.createElement('div')
    el.id = 'screen'
    old.replaceWith(el)
    const o = { screen: s.screen, cells: s.cells, act: s.act }
    if (s.screen === 'overview') o.q1 = s.opt
    if (s.screen === 'change') o.sheet = s.opt
    if (s.screen === 'activity') o.prog = s.opt
    if (s.screen === 'week') o.week = s.opt
    if (s.screen === 'programmes') o.q6 = s.opt
    // Question 7: A is sheet B's step 2; B adds "Show it in the plan" to it.
    if (s.screen === 'preview') Object.assign(o, { screen: 'change', sheet: 'b', step: 2, q7: s.opt })
    PG.mount(el, o)
    document.querySelectorAll('.mock .panel button').forEach((b) => {
      b.setAttribute('aria-pressed', String(s[b.dataset.k] === b.dataset.v))
      if (b.dataset.k === 'opt') b.hidden = b.dataset.v === 'c' && s.screen !== 'overview' && s.screen !== 'programmes'
    })
    document.querySelectorAll('.mock [data-only]').forEach((d) => { d.hidden = d.dataset.only !== s.screen; d.style.display = d.hidden ? 'none' : '' })
  }
  const mock = document.querySelector('.mock')
  mock.querySelector(':scope > button').addEventListener('click', (e) => {
    mock.classList.toggle('open')
    e.currentTarget.setAttribute('aria-expanded', String(mock.classList.contains('open')))
  })
  mock.querySelector('.panel').addEventListener('click', (e) => {
    const b = e.target.closest('button')
    if (!b) return
    const s = { ...read(), [b.dataset.k]: b.dataset.v }
    if (b.dataset.k === 'screen') s.opt = b.dataset.v === 'overview' ? 'c' : 'a'
    write(s)
  })
  addEventListener('hashchange', start)
  start()
</script>
</body>
</html>
