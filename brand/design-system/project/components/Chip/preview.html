<!-- @dsCard group="Planner" height=340 subtitle="Sets × reps, each side, weight — under an exercise name; Shared, a state after a programme's name" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chip — preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: var(--space-6);
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        font-variant-numeric: tabular-nums;
      }
      .chip {
        display: inline-block;
        background: var(--tile);
        color: var(--ink-secondary);
        border-radius: var(--radius-sm);
        padding: 0 var(--space-2);
        white-space: nowrap;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        margin: 0 0 var(--space-6);
        padding: 0;
        list-style: none;
      }
      h2 {
        margin: 0 0 var(--space-3);
        color: var(--ink-secondary);
      }
      .rows {
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--line);
        max-width: 360px;
      }
      .rows li {
        padding: var(--space-2) 0;
        border-bottom: 1px solid var(--line);
      }
      .name {
        display: block;
        font-weight: 600;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-1) var(--space-2);
      }
      .goal {
        color: var(--ink-secondary);
      }
      /* A state after a name, on the name's line (K171): the admin's library row. */
      .state {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-1) var(--space-3);
        margin: 0;
      }
      .state .name {
        font-size: 22px;
        line-height: 1.3;
      }
      @media (max-width: 639px) {
        body {
          padding: var(--space-4);
        }
      }
    </style>
  </head>
  <body>
    <h2 class="label">Every form the detail takes</h2>
    <ul class="chips">
      <li><span class="chip label">3 × 12</span></li>
      <li><span class="chip label">3 × 8 each side</span></li>
      <li><span class="chip label">10 reps a set</span></li>
      <li><span class="chip label">8 each side</span></li>
      <li><span class="chip label">3 sets</span></li>
      <li><span class="chip label">16 kg</span></li>
      <li><span class="chip label">12.5 kg</span></li>
    </ul>
    <h2 class="label">Under a name</h2>
    <ul class="rows">
      <li>
        <span class="name">Squats</span
        ><span class="meta"
          ><span class="chip label">3 × 15</span><span class="chip label">16 kg</span></span
        >
      </li>
      <li>
        <span class="name">Plank</span
        ><span class="meta"><span class="chip label">3 sets</span></span>
      </li>
      <li><span class="name">Back extensions</span><span class="meta"></span></li>
    </ul>
    <h2 class="label" style="margin-top: var(--space-6)">A state, after a name</h2>
    <p class="state">
      <span class="name">Strength 5×5</span><span class="chip label">Shared</span>
    </p>
    <script></script>
  </body>
</html>
