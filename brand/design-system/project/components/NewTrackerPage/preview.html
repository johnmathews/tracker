<!-- @dsCard group="Screens" height=1500 subtitle="The page Add tracker opens: Back, Cancel and Add tracker; a name; the kind as a SegmentedControl with a line on what you log (K124, K128)" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NewTrackerPage — preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: var(--space-6); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-variant-numeric: tabular-nums; }
  .variant { margin: 0 0 var(--space-3); color: var(--ink-secondary); }
  .gap { height: var(--space-8); }
  /* The page, at u = 1 (a 1280×800 screen), at the item page's sizes (K51, K104), with no bar. */
  .stage { border: 1px solid var(--line); border-radius: var(--radius-lg); }
  .page { padding: 28px 48px 64px; display: flex; flex-direction: column; }
  .topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-size: 19px; line-height: 26px; text-decoration: underline; text-underline-offset: 4px; }
  .back svg { width: 26px; height: 26px; }
  .acts { display: flex; align-items: center; gap: 12px; }
  /* Button at the page's size: secondary, quiet and primary. */
  .btn { height: 60px; padding: 0 22px; display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--control-border); border-radius: var(--radius-md); background: transparent; color: var(--ink); font: 600 19px/25px var(--font-sans); cursor: pointer; }
  .btn:hover { background: var(--tile); }
  .btn.quiet { border-color: transparent; }
  .btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .btn.primary:hover { background: color-mix(in srgb, var(--ink) 82%, var(--canvas)); }
  h1.type { margin: 16px 0 0; color: var(--ink-secondary); font-size: 19px; line-height: 25px; font-weight: 600; }
  /* TextField at the page's size, up to 560px. */
  .field { display: flex; flex-direction: column; gap: 10px; min-width: 0; width: 100%; max-width: 560px; margin: 12px 0 28px; }
  .field > .label { font-size: 19px; line-height: 25px; }
  input { height: 60px; width: 100%; padding: 0 15px; border: 1px solid var(--control-border); border-radius: var(--radius-sm); background: var(--panel); color: var(--ink); font: inherit; font-size: 19px; }
  input:hover { border-color: var(--ink); }
  input[aria-invalid="true"] { border-color: var(--error-ink); }
  .err { display: flex; align-items: flex-start; gap: var(--space-2); margin: 4px 0 0; color: var(--error-ink); font-size: 16px; line-height: 22px; }
  .err svg { flex: none; width: 16px; height: 16px; margin-top: 3px; }
  /* Rows like an item's page (Layout A, K65): a rule, the heading in the 320px name column. */
  .sec { display: grid; grid-template-columns: 320px minmax(0, 1fr); align-items: start; padding: 32px 0; border-top: 1px solid var(--line); }
  .sec > .content { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  h2.title-2 { margin: 0; font-size: 27px; line-height: 34px; }
  .lede { margin: 0; max-width: 60ch; color: var(--ink-secondary); font-size: 19px; line-height: 28px; }
  .kind { display: flex; flex-direction: column; gap: 16px; }
  .kind-line { display: grid; gap: 4px; max-width: 60ch; color: var(--ink); font-size: 19px; line-height: 28px; }
  .kind-line p { margin: 0; }
  .seg-field { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  /* SegmentedControl, as its card, at the page's size. */
  .seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; border: 1px solid var(--control-border); border-radius: var(--radius-md); }
  .seg button { height: 58px; padding: 0 22px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink); font: 600 19px/25px var(--font-sans); cursor: pointer; text-wrap: nowrap; }
  .seg button:hover { background: var(--tile); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  .seg button:focus-visible { z-index: 1; }
  @media (prefers-reduced-motion: no-preference) { button, input { transition: background-color 120ms, border-color 120ms, color 120ms; } }
  @media (max-width: 639px) {
    body { padding: var(--space-4); }
    .page { padding: 20px 16px 48px; }
    .back, .lede, .kind-line { font-size: 18px; line-height: 26px; }
    .back svg { width: 22px; height: 22px; }
    h1.type, .field > .label { font-size: 16px; line-height: 22px; }
    h2.title-2 { font-size: 22px; line-height: 28px; }
    .sec { display: flex; flex-direction: column; gap: 16px; padding: 24px 0; }
    .sec > .content { gap: 16px; }
    input, .btn { height: 48px; }
    input { font-size: 18px; }
    .btn { font-size: 16px; }
    .seg button { height: 46px; padding: 0 16px; font-size: 16px; }
  }
</style>
</head>
<body>
<p class="variant label">Opened from Add tracker: Name empty and focused, Strength chosen</p>
<div class="stage">
  <form class="page" onsubmit="return false" data-page="a">
    <div class="topline"><a class="back" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>Back to the week</span></a><div class="acts"><button type="button" class="btn quiet">Cancel</button><button type="submit" class="btn primary">Add tracker</button></div></div>
    <h1 class="type">New tracker</h1>
    <div class="field"><label class="label" for="a-name">Name</label><input id="a-name" maxlength="60" autocomplete="off" value=""></div>
    <section class="sec" aria-labelledby="a-kind">
      <h2 class="title-2" id="a-kind">Kind</h2>
      <div class="content">
        <div class="kind">
          <div class="seg-field"><div class="seg" role="group" aria-label="Kind"><button type="button" aria-pressed="true" data-kind="strength">Strength</button><button type="button" aria-pressed="false" data-kind="cardio">Cardio</button><button type="button" aria-pressed="false" data-kind="food">Food</button><button type="button" aria-pressed="false" data-kind="mobility">Mobility</button></div></div>
          <div class="kind-line" aria-live="polite"><p class="v">Log sets, reps, time and weight.</p></div>
        </div>
      </div>
    </section>
  </form>
</div>

<div class="gap"></div>
<p class="variant label">Add tracker with no name: the field’s error, nothing added; Food chosen</p>
<div class="stage">
  <form class="page" onsubmit="return false" data-page="b">
    <div class="topline"><a class="back" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>Back to the week</span></a><div class="acts"><button type="button" class="btn quiet">Cancel</button><button type="submit" class="btn primary">Add tracker</button></div></div>
    <h1 class="type">New tracker</h1>
    <div class="field"><label class="label" for="b-name">Name</label><input id="b-name" maxlength="60" autocomplete="off" value="" aria-invalid="true" aria-describedby="b-name-error"><p class="err" id="b-name-error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg><span>Enter a name.</span></p></div>
    <section class="sec" aria-labelledby="b-kind">
      <h2 class="title-2" id="b-kind">Kind</h2>
      <div class="content">
        <div class="kind">
          <div class="seg-field"><div class="seg" role="group" aria-label="Kind"><button type="button" aria-pressed="false" data-kind="strength">Strength</button><button type="button" aria-pressed="false" data-kind="cardio">Cardio</button><button type="button" aria-pressed="true" data-kind="food">Food</button><button type="button" aria-pressed="false" data-kind="mobility">Mobility</button></div></div>
          <div class="kind-line" aria-live="polite"><p class="v">Log portions.</p></div>
        </div>
      </div>
    </section>
  </form>
</div>
<script>
(() => {
  // The Kind control works: one kind chosen, and its line under the control.
  const LINES = {
    strength: 'Log sets, reps, time and weight.',
    cardio: 'Log time and distance.',
    food: 'Log portions.',
    mobility: 'Log sets, reps or hold time, each side.',
  }
  for (const form of document.querySelectorAll('form[data-page]')) {
    const line = form.querySelector('.kind-line')
    for (const button of form.querySelectorAll('.seg button')) {
      button.addEventListener('click', () => {
        for (const b of form.querySelectorAll('.seg button')) b.setAttribute('aria-pressed', String(b === button))
        line.querySelector('.v').textContent = LINES[button.dataset.kind]
      })
    }
  }
})()
</script>
</body>
</html>
