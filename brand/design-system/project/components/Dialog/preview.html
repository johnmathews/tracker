<!-- @dsCard group="Overlays" height=900 subtitle="A modal panel on the scrim, at the page's size: Edit exercise" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dialog — preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: var(--space-6); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-variant-numeric: tabular-nums; }

  /* The stage stands in for the viewport: the page behind, the scrim, the dialog. */
  .stage { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-lg); min-height: 860px; padding: var(--space-6); }
  .behind h1 { margin: 0 0 var(--space-6); }
  .behind p { margin: 0; padding: var(--space-3) 0; border-bottom: 1px solid var(--line); font-weight: 600; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); opacity: .4; }

  .dialog { position: absolute; top: var(--space-16); left: 50%; transform: translateX(-50%); width: min(720px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-overlay); padding: 32px; }
  /* At u = 1 (a 1280×800 screen), K55: in the app the sizes follow the screen (README). */
  .dialog .title-2 { font-size: 27px; line-height: 34px; }
  .dialog .label { font-size: 19px; line-height: 25px; }
  .dialog .caption { font-size: 16px; line-height: 22px; }
  .dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-2); margin: calc(-1 * var(--space-3)) calc(-1 * var(--space-3)) 0 0; }
  .dialog-head h2 { margin: var(--space-3) 0 0; }
  form { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }

  /* IconButton: 44px, Lucide icon at 20px. */
  .icon-btn { width: 52px; height: 52px; flex: none; display: grid; place-items: center; padding: 0; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink); cursor: pointer; }
  .icon-btn:hover { background: var(--tile); }
  .icon-btn svg { width: 28px; height: 28px; }

  /* Fields: visible label above, 44px input. */
  .field { display: flex; flex-direction: column; gap: var(--space-1); }
  .hint { color: var(--ink-secondary); }
  input { height: 60px; width: 100%; padding: 0 15px; border: 1px solid var(--control-border); border-radius: var(--radius-sm); background: var(--panel); color: var(--ink); font: inherit; font-size: 19px; font-variant-numeric: tabular-nums; }
  .row { display: flex; flex-wrap: wrap; gap: 20px 24px; align-items: flex-start; }
  .narrow { width: 96px; }
  .weight { width: 170px; }

  .seg-wrap { display: flex; flex-direction: column; gap: var(--space-1); }
  /* SegmentedControl, drawn exactly as its own card: 44px tall, no inset, every segment in label type. */
  .seg { display: inline-flex; flex-wrap: wrap; align-self: flex-start; box-sizing: border-box; max-width: 100%; border: 1px solid var(--control-border); border-radius: var(--radius-md); }
  .seg button { position: relative; height: 58px; padding: 0 22px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink); font: 600 19px/25px var(--font-sans); cursor: pointer; text-wrap: nowrap; }
  .seg button:hover, .seg button.is-hover { background: var(--tile); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  .seg button:focus-visible, .seg button.is-focus { z-index: 1; outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    .seg button { transition: background-color 120ms ease-out, color 120ms ease-out; }
  }

  .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; padding-top: 8px; }
  .btn { height: 60px; padding: 0 22px; border-radius: var(--radius-md); font: inherit; font-size: 19px; font-weight: 600; cursor: pointer; }
  .btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--control-border); }
  .btn.secondary:hover { background: var(--tile); }
  .btn.primary { background: var(--ink); color: var(--on-ink); border: 1px solid var(--ink); }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) { .btn, .icon-btn, .seg button { transition: background-color 120ms, color 120ms; } }
  @media (max-width: 639px) {
    body { padding: var(--space-4); }
    /* Folded, the system's sizes on n (1 on a phone): 48px controls, 16px labels, a 22px title. */
    .stage { padding: var(--space-4); min-height: 1180px; }
    .dialog { top: var(--space-12); padding: var(--space-4); }
    .dialog .title-2 { font-size: 22px; line-height: 28px; }
    .dialog .label { font-size: 16px; line-height: 22px; }
    input, .stepper, .btn { height: 48px; }
    input { font-size: 18px; }
    .seg button { height: 46px; padding: 0 16px; font-size: 16px; }
    .stepper button { width: 48px; }
    .icon-btn { width: 44px; height: 44px; }
    .area { font-size: 18px; }
    .value { min-width: 52px; font-size: 20px; }
  }
  .stepper { display: inline-flex; align-items: stretch; box-sizing: border-box; height: 60px; border: 1px solid var(--control-border); border-radius: var(--radius-md); }
  .stepper button { display: inline-flex; align-items: center; justify-content: center; width: 60px; padding: 0; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink); cursor: pointer; }
  .stepper button svg { width: 26px; height: 26px; }
  .stepper button:hover { background: var(--tile); }
  .stepper button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .value { display: flex; align-items: center; justify-content: center; min-width: 66px; padding: 0 var(--space-1); font: 600 24px/30px var(--font-sans); font-variant-numeric: tabular-nums; }
  /* The Note field (K43): the TextArea card's box. */
  .area { box-sizing: border-box; display: block; width: 100%; min-height: 84px; padding: 11px 15px; border: 1px solid var(--control-border); border-radius: var(--radius-sm); background: var(--panel); color: var(--ink); font: 400 19px/27px var(--font-sans); resize: vertical; }
  .area:hover { border-color: var(--ink); }
  .area:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .hint { display: flex; justify-content: space-between; gap: 16px; margin: 0; } .hint .count { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="stage">
  <div class="behind" aria-hidden="true" inert>
    <h1 class="title-1">Exercises</h1>
    <p>Push-ups</p>
    <p>Pull-ups</p>
    <p>Squats</p>
    <p>Kettlebell halos</p>
  </div>
  <div class="scrim" aria-hidden="true"></div>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <div class="dialog-head">
      <h2 class="title-2" id="dlg-title">Edit exercise</h2>
      <button type="button" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
      </button>
    </div>
    <form onsubmit="return false">
      <div class="field">
        <label class="label" for="f-name">Name</label>
        <input id="f-name" value="Kettlebell halos" required>
      </div>
      <div class="row">
        <div class="field narrow">
          <label class="label" for="f-sets">Sets</label>
          <input id="f-sets" value="3" inputmode="numeric" maxlength="2">
        </div>
        <div class="seg-wrap">
          <span class="label" id="f-measure">Measure</span>
          <div class="seg" role="group" aria-labelledby="f-measure">
            <button type="button" tabindex="0" aria-pressed="true">Reps</button>
            <button type="button" tabindex="-1" aria-pressed="false">Time</button>
          </div>
        </div>
        <div class="field narrow">
          <label class="label" for="f-reps">Reps</label>
          <input id="f-reps" value="8" inputmode="numeric">
        </div>
      </div>
      <div class="row">
        <div class="seg-wrap">
          <span class="label" id="f-count">Reps count</span>
          <div class="seg" role="group" aria-labelledby="f-count">
            <button type="button" tabindex="-1" aria-pressed="false">Per set</button>
            <button type="button" tabindex="0" aria-pressed="true">Each side</button>
          </div>
        </div>
        <div class="field">
          <label class="label" for="f-weight">Weight in kg</label>
          <input id="f-weight" class="weight" value="8" inputmode="decimal" placeholder="Bodyweight">
        </div>
        <div class="field">
          <span class="label" id="f-target">Times a week</span>
          <div class="stepper" role="group" aria-labelledby="f-target">
            <button type="button" aria-label="Fewer times a week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
            <output class="value" aria-live="polite">2</output>
            <button type="button" aria-label="More times a week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
          </div>
        </div>
      </div>
      <div class="field">
        <label class="label" for="f-note">Note</label>
        <textarea id="f-note" class="area" aria-describedby="f-note-hint" maxlength="20000">**Ribs down.** Change direction each set.</textarea>
        <p class="caption hint" id="f-note-hint">Markdown works: **bold**, *italic*, links.</p>
      </div>
      <div class="actions">
        <button type="button" class="btn secondary">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </div>
</div>
<script>
(() => {
  document.addEventListener('click', (e) => {
    const seg = e.target.closest('.seg button');
    if (seg) seg.parentElement.querySelectorAll('button').forEach((b) => { b.setAttribute('aria-pressed', String(b === seg)); b.tabIndex = b === seg ? 0 : -1; });
  });
  // SegmentedControl: one tab stop; arrow keys move between segments (Reka's roving focus).
  document.querySelectorAll('.seg').forEach((g) => g.addEventListener('keydown', (e) => {
    const all = [...g.querySelectorAll('button:not([disabled])')];
    const i = all.indexOf(e.target);
    const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (i < 0 || !d) return;
    e.preventDefault();
    const next = all[(i + d + all.length) % all.length];
    all.forEach((b) => (b.tabIndex = b === next ? 0 : -1));
    next.focus();
  }));
})();
</script>
</body>
</html>
