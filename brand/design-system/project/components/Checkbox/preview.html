<!-- @dsCard group="Forms" height=620 subtitle="A box to tick inside a form with a Save; the whole 48px row is the target" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkbox — preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: var(--space-6) var(--space-4); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); }
  .grid { display: flex; flex-wrap: wrap; gap: var(--space-4) var(--space-6); align-items: flex-start; }
  .cell { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-1); }
  .state { margin: 0; color: var(--ink-secondary); }
  .gap { height: var(--space-6); }

  .cb { display: flex; align-items: center; gap: var(--space-3); min-height: 48px; padding: 0; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink); font: 400 16px/24px var(--font-sans); text-align: left; cursor: pointer; }
  .cb:focus-visible, .cb.is-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
  .cb:disabled { opacity: .4; cursor: not-allowed; }
  .box { display: grid; place-content: center; flex: none; width: 24px; height: 24px; border: 2px solid var(--control-border); border-radius: var(--radius-sm); background: var(--panel); }
  .box svg { width: 16px; height: 16px; color: var(--on-ink); visibility: hidden; }
  .cb:hover:not(:disabled) .box, .cb.is-hover .box { border-color: var(--ink); }
  .cb[aria-checked="true"] .box { background: var(--ink); border-color: var(--ink); }
  .cb[aria-checked="true"] .box svg { visibility: visible; }
  @media (prefers-reduced-motion: no-preference) {
    .box { transition: background-color 120ms ease-out, border-color 120ms ease-out; }
  }

  /* The exception week's rest list (ExceptionWeekEditor, K191): rows on a tile, ruled. */
  .rest { display: flex; flex-direction: column; gap: var(--space-3); max-width: 420px; padding: var(--space-4); border-radius: var(--radius-md); background: var(--tile); }
  .rest > .lbl { font: 600 16px/22px var(--font-sans); }
  .rest ul { list-style: none; margin: 0; padding: 0; }
  .rest li + li { border-top: 1px solid var(--control-border); }
  .rest .cb { width: 100%; }
  .hint { margin: 0; color: var(--ink-secondary); font-size: 14px; line-height: 20px; }
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><p class="caption state">Unticked</p>
    <button class="cb" type="button" role="checkbox" aria-checked="false"><span class="box" aria-hidden="true"></span>Back squat</button></div>
  <div class="cell"><p class="caption state">Ticked</p>
    <button class="cb" type="button" role="checkbox" aria-checked="true"><span class="box" aria-hidden="true"></span>Deadlift</button></div>
  <div class="cell"><p class="caption state">Hover</p>
    <button class="cb is-hover" type="button" role="checkbox" aria-checked="false"><span class="box" aria-hidden="true"></span>Bench press</button></div>
  <div class="cell"><p class="caption state">Focus</p>
    <button class="cb is-focus" type="button" role="checkbox" aria-checked="true"><span class="box" aria-hidden="true"></span>Barbell row</button></div>
  <div class="cell"><p class="caption state">Disabled</p>
    <button class="cb" type="button" role="checkbox" aria-checked="false" disabled><span class="box" aria-hidden="true"></span>Plank</button></div>
  <div class="cell"><p class="caption state">Disabled, ticked</p>
    <button class="cb" type="button" role="checkbox" aria-checked="true" disabled><span class="box" aria-hidden="true"></span>Plank</button></div>
</div>

<div class="gap"></div>
<p class="caption state">In a list: an exception week rests the legs (ExceptionWeekEditor)</p>
<div class="rest" role="group" aria-labelledby="rest-h">
  <span class="lbl" id="rest-h">Rest these activities</span>
  <ul data-list></ul>
  <p class="hint">A rested activity has no sessions in these weeks.</p>
</div>

<script>
;(() => {
  const tick = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>'
  for (const box of document.querySelectorAll('.box')) box.innerHTML = tick
  const rows = [['Every activity', false], ['Back squat', true], ['Bench press', false], ['Barbell row', false], ['Deadlift', true], ['Plank', false]]
  document.querySelector('[data-list]').innerHTML = rows.map(([n, on]) => `<li><button class="cb" type="button" role="checkbox" aria-checked="${on}"><span class="box" aria-hidden="true">${tick}</span>${n}</button></li>`).join('')
})()
</script>
</body>
</html>
