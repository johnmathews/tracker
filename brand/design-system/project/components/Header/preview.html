<!-- @dsCard group="Basics" height=980 subtitle="The app bar, full width and as big as the week: the week as its title, then BarActions ending with Profile (K106); desktop and a 375px phone" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Header — preview</title>
<style>
  body { margin: 0; padding: var(--space-6) var(--space-4); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); }
  .state { margin: 0 0 var(--space-1); color: var(--ink-secondary); }
  .frame { border: 1px solid var(--line); border-radius: var(--radius-md); margin-bottom: var(--space-6); }
  .frame:last-of-type { margin-bottom: 0; }
  .phone { max-width: 375px; }
  /* The desktop bar is wider than a phone: on one, its specimen scrolls inside its frame. */
  .frame.desktop { overflow-x: auto; }
  .frame.desktop header { min-width: 1100px; }

  /* At u = 1 (a 1280×800 screen); in the app every size follows the screen (README). One row: the
     week first, as the page's title (K81), the actions at the end. Full width, on the page's own
     48u margins. */
  header { position: relative; display: flex; align-items: center; justify-content: space-between; gap: var(--space-2) var(--space-4); box-sizing: border-box;
    padding: 14px 48px; background: var(--canvas); border-bottom: 1px solid var(--line); border-radius: var(--radius-md) var(--radius-md) 0 0; }
  .week { display: flex; align-items: center; }
  .week-label { min-width: 6.5em; padding-inline: var(--space-2); text-align: center; font: 600 40px/44px var(--font-serif); font-variant-numeric: tabular-nums; text-wrap: nowrap; }
  .arrow { display: grid; place-items: center; width: 60px; height: 60px; padding: 0; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink); cursor: pointer; }
  .arrow svg { width: 32px; height: 32px; }
  .end { display: flex; align-items: stretch; gap: 8px; }

  /* BarAction, drawn as its own card. */
  .bar-action { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box;
    min-width: 96px; min-height: 44px; padding: 10px 12px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink); cursor: pointer; }
  .bar-action svg { width: 32px; height: 32px; flex: none; }
  .bar-action .name { font: 600 17px/22px var(--font-sans); white-space: nowrap; }
  .arrow:hover, .bar-action:hover, .bar-action.is-hover { background: var(--tile); }
  /* The keyboard's "Edit plan" (K82), shown only while it has focus, over the start of the bar. */
  .skip { position: absolute; top: 6px; left: 8px; z-index: 1; padding: 8px 12px; border-radius: var(--radius-md); background: var(--panel); color: var(--ink);
    font: 600 16px/22px var(--font-sans); text-decoration: underline; text-underline-offset: 4px; box-shadow: var(--shadow-overlay);
    outline: 2px solid var(--focus); outline-offset: 2px; border: 0; }
  .arrow:focus-visible, .arrow.is-focus, .bar-action:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    .arrow, .bar-action { transition: background-color 120ms ease-out, color 120ms ease-out; }
  }

  /* Folded (a phone, an upright iPad): the week across the first row, centred, the actions
     sharing the second equally. */
  .phone header { flex-direction: column; align-items: stretch; gap: 6px; padding: 8px 12px 10px; }
  .phone .week { justify-content: center; }
  .phone .week-label { font-size: 26px; line-height: 30px; }
  .phone .arrow { width: 48px; height: 48px; }
  .phone .arrow svg { width: 26px; height: 26px; }
  .phone .end { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .phone .bar-action { min-width: 0; padding: 8px 4px; gap: 4px; }
  .phone .bar-action svg { width: 26px; height: 26px; }
  .phone .bar-action .name { font-size: 16px; line-height: 20px; }
</style>
</head>
<body>
<p class="caption state">Desktop, looking at last week; focus on next week</p>
<div class="frame desktop">

17.925 20.056a6 6 0 0 0-11.851.001"/><circle cx="12" cy="11" r="4"/><circle cx="12" cy="12" r="10"/></svg><span class="name">Profile</span></button></div>
